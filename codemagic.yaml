workflows:
  ai-smart-panel-android:
    name: AI Smart Panel - Android APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: stable

    scripts:
      - name: Check Flutter and install dependencies
        script: |
          flutter --version
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
